name: Build

on:
  push:
    branches:
      - main
      - agent/**
      - publish-v*
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  tower-balance:
    name: Tower balance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile balance contract
        run: |
          mkdir -p build/tower-balance
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude \
            tests/tower_balance_tests.cpp source/Enemy.cpp source/Level.cpp source/Tower.cpp \
            source/Projectile.cpp source/Wave.cpp -o build/tower-balance/tests
      - name: Verify representative kill times
        run: build/tower-balance/tests

  campaign-balance:
    name: Campaign balance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile campaign contract
        run: |
          mkdir -p build/campaign-balance
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude \
            tests/campaign_balance_tests.cpp source/Economy.cpp source/Enemy.cpp source/Level.cpp \
            -o build/campaign-balance/tests
      - name: Verify campaign pressure curve
        run: build/campaign-balance/tests "$GITHUB_WORKSPACE"

  build-release:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == publish-v* ]]; then
            version="${GITHUB_REF_NAME#publish-}"
            manifest="hardware-audit/releases/$version/manifest.json"
            test -f "$manifest"
            source_commit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$manifest")
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$source_commit^{commit}"
            git checkout --detach "$source_commit"
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Verify toolchain
        run: |
          test -f "$DEVKITARM/3ds_rules"
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          test -f "$DEVKITPRO/libctru/lib/libctru.a"
          test -f "$DEVKITPRO/libctru/lib/libcitro3d.a"
          test -f "$DEVKITPRO/libctru/lib/libcitro2d.a"
          command -v picasso
          command -v python3
          command -v g++
      - name: Host tests
        shell: bash
        run: bash scripts/run_host_tests.sh
      - name: Build 3DSX and CIA
        shell: bash
        run: |
          set -o pipefail
          make release -j2 2>&1 | tee build.log
          cd dist && sha256sum -c SHA256SUMS.txt
      - name: Record source commit
        shell: bash
        run: printf '%s\n' '${{ steps.source.outputs.source_commit }}' > dist/SOURCE_COMMIT.txt
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CitadelDefense3D-build-log
          path: build.log
          if-no-files-found: warn
      - name: Upload playable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CitadelDefense3D-playable
          path: |
            dist/CitadelDefense3D.3dsx
            dist/CitadelDefense3D.cia
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error

  azahar-smoke:
    name: Azahar smoke test and screenshot
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CitadelDefense3D-playable
          path: dist
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq xvfb imagemagick libfuse2 libgl1 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Download Azahar
        shell: bash
        run: |
          curl -fsSL "https://api.github.com/repos/azahar-emu/azahar/releases?per_page=10" > releases.json
          url=$(jq -r '[.[] | select(.draft == false) | .assets[] | select(.name | test("\\.AppImage$")) | select((.name | ascii_downcase | contains("wayland")) | not) | .browser_download_url][0]' releases.json)
          test "$url" != "null"
          curl -fL --retry 3 "$url" -o azahar.AppImage
          chmod +x azahar.AppImage
          ./azahar.AppImage --appimage-extract > azahar-extract.log 2>&1
          test -x squashfs-root/AppRun
      - name: Install CIA
        shell: bash
        run: |
          set -o pipefail
          mkdir -p azahar-home
          HOME="$PWD/azahar-home" timeout 90s xvfb-run -a ./squashfs-root/AppRun --install "$PWD/dist/CitadelDefense3D.cia" 2>&1 | tee azahar-cia-install.log
      - name: Launch 3DSX and capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 2
          HOME="$PWD/azahar-home" ./squashfs-root/AppRun -w "$PWD/dist/CitadelDefense3D.3dsx" > azahar-3dsx-launch.log 2>&1 &
          azahar_pid=$!
          cleanup() {
            kill "$azahar_pid" 2>/dev/null || true
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$azahar_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 10
          kill -0 "$azahar_pid"
          import -display :99 -window root dist/CitadelDefense3D-Azahar.png
          test -s dist/CitadelDefense3D-Azahar.png
          test "$(identify -format '%w' dist/CitadelDefense3D-Azahar.png)" -ge 800
          test "$(identify -format '%h' dist/CitadelDefense3D-Azahar.png)" -ge 480
          test "$(identify -format '%k' dist/CitadelDefense3D-Azahar.png)" -gt 16
      - name: Upload shareable build
        uses: actions/upload-artifact@v4
        with:
          name: CitadelDefense3D-shareable
          path: |
            dist/CitadelDefense3D.3dsx
            dist/CitadelDefense3D.cia
            dist/CitadelDefense3D-Azahar.png
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error
      - name: Upload Azahar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CitadelDefense3D-Azahar-logs
          path: |
            azahar-*.log
            xvfb.log
          if-no-files-found: warn

  hardware-release-audit:
    name: Old 3DS release evidence
    if: github.event_name == 'push' && startsWith(github.ref_name, 'publish-v')
    needs:
      - build-release
      - azahar-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CitadelDefense3D-shareable
          path: dist
      - name: Validate hardware evidence
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#publish-}"
          manifest="hardware-audit/releases/$version/manifest.json"
          test "$(cat dist/SOURCE_COMMIT.txt)" = "${{ needs.build-release.outputs.source_commit }}"
          python3 scripts/validate_hardware_evidence.py \
            --manifest "$manifest" \
            --expected-version "$version" \
            --expected-commit "${{ needs.build-release.outputs.source_commit }}" \
            --artifact-dir dist \
            --repository-root "$GITHUB_WORKSPACE" \
            --release
          archive="CitadelDefense3D-hardware-audit-$version.zip"
          (cd "hardware-audit/releases/$version" && zip -r "$GITHUB_WORKSPACE/dist/$archive" .)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload hardware evidence package
        uses: actions/upload-artifact@v4
        with:
          name: CitadelDefense3D-hardware-audit
          path: dist/${{ steps.audit.outputs.archive }}
          if-no-files-found: error

  publish-release:
    name: Publish immutable alpha release
    if: github.event_name == 'push' && startsWith(github.ref_name, 'publish-v')
    needs:
      - tower-balance
      - campaign-balance
      - build-release
      - azahar-smoke
      - hardware-release-audit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CitadelDefense3D-shareable
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: CitadelDefense3D-hardware-audit
          path: dist
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#publish-}"
          test "$version" != "$GITHUB_REF_NAME"
          test -f "releases/$version.txt"
          test -s "dist/CitadelDefense3D-hardware-audit-$version.zip"
          test "$(cat dist/SOURCE_COMMIT.txt)" = "${{ needs.build-release.outputs.source_commit }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists; releases are immutable." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/CitadelDefense3D.cia
          test -s dist/CitadelDefense3D.3dsx
          test -s dist/CitadelDefense3D-Azahar.png
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test -s docs/INSTALLATION.md
      - name: Publish GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.build-release.outputs.source_commit }}" \
            --title "$version" \
            --notes-file "releases/$version.txt" \
            --prerelease \
            dist/CitadelDefense3D.cia \
            dist/CitadelDefense3D.3dsx \
            dist/CitadelDefense3D-Azahar.png \
            dist/SHA256SUMS.txt \
            dist/SOURCE_COMMIT.txt \
            "dist/CitadelDefense3D-hardware-audit-$version.zip" \
            docs/INSTALLATION.md
